<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Anmeldung beim Pokémon Trainer Club</title>
<link rel="stylesheet" href="pgl.css">
</head>
<body>

<div class="pgl-login-widget">

  <p class="pgl-heading">Wenn du bereits ein Konto für den Pokémon Trainer Club besitzt, melde dich hier an.</p>

  <form class="pgl-form" id="pgl-login-form" method="post">

    <div class="pgl-field">
      <input class="pgl-input" type="text" name="username" size="30" placeholder="Benutzername eingeben" autocomplete="username">
      <div class="pgl-help-link">
        <a href="https://www.pokemon.com/de/account/pgl/forgot-username" target="_blank">Benutzername vergessen?</a>
      </div>
    </div>

    <div class="pgl-field">
      <input class="pgl-input" type="password" name="password" size="30" placeholder="Passwort eingeben" autocomplete="current-password">
      <div class="pgl-help-link">
        <a href="https://www.pokemon.com/de/account/pgl/forgot-password" target="_blank">Passwort vergessen?</a>
      </div>
    </div>

    <p class="pgl-error" id="pgl-login-error" hidden></p>

    <input class="pgl-login-button" type="submit" name="Login" value="Anmelden">
  </form>

  <p class="pgl-heading">Neu bei Pokemon.de? Richte ein Konto ein!</p>

  <div class="pgl-signup-wrap">
    <a class="pgl-signup-button" href="https://www.pokemon.com/de/account/pgl/signup/" target="_blank">Neues Konto !</a>
  </div>

</div>

<script src="pgl.js"></script>
</body>
</html>
