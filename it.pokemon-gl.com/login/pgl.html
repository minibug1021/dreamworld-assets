<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Accesso al Club Allenatori di Pokémon</title>
<link rel="stylesheet" href="pgl.css">
</head>
<body>

<div class="pgl-login-widget">

  <p class="pgl-heading">Se hai già un account al Club Allenatori di Pokémon, accedi qui.</p>

  <form class="pgl-form" id="pgl-login-form" method="post">

    <div class="pgl-field">
      <input class="pgl-input" type="text" name="username" size="30" placeholder="Inserisci il nome utente" autocomplete="username">
      <div class="pgl-help-link">
        <a href="https://www.pokemon.com/it/account/pgl/forgot-username" target="_blank">Hai dimenticato il nome utente?</a>
      </div>
    </div>

    <div class="pgl-field">
      <input class="pgl-input" type="password" name="password" size="30" placeholder="Inserisci la password" autocomplete="current-password">
      <div class="pgl-help-link">
        <a href="https://www.pokemon.com/it/account/pgl/forgot-password" target="_blank">Hai dimenticato la password?</a>
      </div>
    </div>

    <p class="pgl-error" id="pgl-login-error" hidden></p>

    <input class="pgl-login-button" type="submit" name="Login" value="Accedi">
  </form>

  <p class="pgl-heading">Non hai ancora un account? Creane uno adesso!</p>

  <div class="pgl-signup-wrap">
    <a class="pgl-signup-button" href="https://www.pokemon.com/it/account/pgl/signup/" target="_blank">Iscriviti</a>
  </div>

</div>

<script src="pgl.js"></script>
</body>
</html>
